<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doll Garden Diorama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL diorama; a title card top-left and a "pose deck" docked at the bottom. Single dusk look by design. */
:root{
  --night:#15121f;      /* indigo dusk, panel ground */
  --night-2:#211c31;
  --paper:#f4ebe6;      /* rice-paper text */
  --paper-dim:#bfb3c4;
  --sakura:#f3a6bd;     /* accent */
  --lantern:#ffb763;    /* warm secondary */
  --line:rgba(244,235,230,.14);
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.title{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));
  max-width:min(320px,calc(100% - 32px));pointer-events:none;
}
.title h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,30px);line-height:1.1;margin:0;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.title p{margin:6px 0 0;font-size:13px;color:var(--paper-dim);text-shadow:0 1px 10px rgba(0,0,0,.6)}
.deck{
  position:fixed;left:0;right:0;bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;justify-content:center;pointer-events:none;
}
.panel{
  pointer-events:auto;width:min(720px,100%);
  background:color-mix(in srgb,var(--night) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:12px;
}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-dim)}
.clips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.clips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.clip{
  font:inherit;color:var(--paper);background:var(--night-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0;
}
.clip b{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip span{font-size:11px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.clip:hover{border-color:color-mix(in srgb,var(--sakura) 55%,transparent)}
.clip[aria-pressed="true"]{background:color-mix(in srgb,var(--sakura) 22%,var(--night-2));border-color:var(--sakura)}
.clip[aria-pressed="true"] span{color:var(--paper)}
.ctl{font:inherit;font-size:13px;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.ctl[aria-pressed="true"]{border-color:var(--lantern);color:var(--lantern)}
.speed{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;font-variant-numeric:tabular-nums}
.speed input{accent-color:var(--sakura);width:110px}
button:focus-visible,input:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.status{
  position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;
  font-family:var(--display);font-size:18px;color:var(--paper);text-align:center;padding-inline:16px
}
.status small{display:block;font-family:var(--body);font-size:12px;color:var(--paper-dim);margin-top:6px}
.hint{font-size:12px;color:var(--paper-dim)}
</style>

<canvas id="stage" aria-label="3D garden scene with the animated doll"></canvas>
<div class="title">
  <h1>Doll Garden</h1>
  <p>Drag to orbit · pinch or scroll to zoom · keys 1–4 switch clips</p>
</div>
<div class="status" id="status">Setting the garden…<small id="progress">loading doll.glb</small></div>

<div class="deck">
  <div class="panel">
    <div class="clips" id="clips" role="group" aria-label="Animation clips"></div>
    <div class="row">
      <button class="ctl" id="pause" aria-pressed="false">Pause</button>
      <button class="ctl" id="orbit" aria-pressed="true">Auto-orbit</button>
      <button class="ctl" id="petals" aria-pressed="true">Petals</button>
      <button class="ctl" id="reset">Reset view</button>
      <label class="speed" for="rate"><span class="label">Speed</span><input id="rate" type="range" min="0.25" max="2" step="0.05" value="1"><output id="rateOut">1.00×</output></label>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x3a2f4f, 9, 26);
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const HOME = new THREE.Vector3(2.0, 1.55, 4.1), TARGET = new THREE.Vector3(0, 0.5, 0);
camera.position.copy(HOME);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(TARGET); controls.enableDamping = true;
controls.minDistance = 1.0; controls.maxDistance = 10; controls.maxPolarAngle = 1.48;
controls.autoRotate = !reduce; controls.autoRotateSpeed = 0.5;

// ---------- sky dome (dusk gradient) ----------
const sky = new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:new THREE.Color(0x1b1836)}, mid:{value:new THREE.Color(0x6b4a7a)}, low:{value:new THREE.Color(0xf2a98a)}},
  vertexShader:'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader:'uniform vec3 top,mid,low; varying vec3 p; void main(){ float h=p.y; vec3 c = h>0.12 ? mix(mid,top,smoothstep(0.12,0.75,h)) : mix(low,mid,smoothstep(-0.15,0.12,h)); gl_FragColor=vec4(c,1.); }'
}));
scene.add(sky);
// a few stars
{ const g=new THREE.BufferGeometry(), n=260, a=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const t=Math.random()*Math.PI*2, y=0.35+Math.random()*0.6, r=Math.sqrt(1-y*y);
    a.set([Math.cos(t)*r*38, y*38, Math.sin(t)*r*38], i*3); }
  g.setAttribute('position', new THREE.BufferAttribute(a,3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color:0xfff2e0, size:0.12, fog:false, transparent:true, opacity:.8}))); }

// ---------- light ----------
scene.add(new THREE.HemisphereLight(0x8a7cc0, 0x2f3d24, 0.5));
const sun = new THREE.DirectionalLight(0xffc49a, 1.6);
sun.position.set(-4, 5, 3.5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
Object.assign(sun.shadow.camera, {left:-4, right:4, top:4, bottom:-4, near:0.5, far:20});
scene.add(sun);
const rim = new THREE.DirectionalLight(0xb7a6ff, 0.5); rim.position.set(3, 2.5, -4); scene.add(rim);

const std = (color, o={}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:0.9, metalness:0}, o));
const shadowed = m => { m.castShadow = true; m.receiveShadow = true; return m; };
const rand = (a,b) => a + Math.random()*(b-a);

// ---------- floating island ----------
const ISL = 3.2;
const top = new THREE.Mesh(new THREE.CylinderGeometry(ISL, ISL*0.96, 0.32, 64), std(0x5f7f49));
top.position.y = -0.16; top.receiveShadow = true; scene.add(top);
const soil = new THREE.Mesh(new THREE.ConeGeometry(ISL*0.96, 2.4, 40, 4), std(0x5a4636, {flatShading:true}));
soil.rotation.x = Math.PI; soil.position.y = -1.52;
{ const p = soil.geometry.attributes.position; for(let i=0;i<p.count;i++){ if(p.getY(i) < 1.1){ p.setX(i,p.getX(i)*rand(0.85,1.12)); p.setZ(i,p.getZ(i)*rand(0.85,1.12)); } } soil.geometry.computeVertexNormals(); }
scene.add(soil);

// tatami mat with dark cloth border (heri)
const mat = new THREE.Group();
const tatami = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 1.25), std(0xc9b77a, {roughness:1})));
tatami.position.y = 0.035; mat.add(tatami);
for (const z of [-0.6, 0.6]) { const b = shadowed(new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.075, 0.07), std(0x2d2a3a))); b.position.set(0, 0.036, z); mat.add(b); }
// woven lines
{ const lines = new THREE.Group(), lm = std(0xb3a165);
  for(let i=-0.68;i<=0.68;i+=0.045){ const l=new THREE.Mesh(new THREE.BoxGeometry(0.006,0.002,1.13), lm); l.position.set(i,0.0715,0); lines.add(l); } mat.add(lines); }
scene.add(mat);

// pond
const pond = new THREE.Mesh(new THREE.CircleGeometry(0.75, 48), std(0x2f4f6e, {roughness:0.12, metalness:0.2}));
pond.rotation.x = -Math.PI/2; pond.position.set(1.65, 0.004, 0.85); pond.receiveShadow = true; scene.add(pond);
const pondRim = new THREE.Mesh(new THREE.RingGeometry(0.74, 0.82, 48), std(0x6c6a66));
pondRim.rotation.x = -Math.PI/2; pondRim.position.set(1.65, 0.006, 0.85); scene.add(pondRim);
for (let i=0;i<4;i++){ const pad=new THREE.Mesh(new THREE.CircleGeometry(rand(0.07,0.11),12,0.3,Math.PI*1.8), std(0x4f8a4c));
  pad.rotation.x=-Math.PI/2; pad.rotation.z=rand(0,6); const a=rand(0,6.28), r=rand(0.15,0.55);
  pad.position.set(1.65+Math.cos(a)*r, 0.01, 0.85+Math.sin(a)*r); scene.add(pad); }

// stepping stones
for (let i=0;i<5;i++){ const s=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rand(0.13,0.18),rand(0.15,0.2),0.06,9), std(0x8c8a86,{flatShading:true})));
  s.position.set(-0.2 + i*0.05 + rand(-0.05,0.05), 0.02, 0.95 + i*0.42); s.rotation.y=rand(0,3); scene.add(s); }

// stone lantern (tōrō)
const lanternLight = new THREE.PointLight(0xffa94d, 1.2, 4, 2);
{ const g = new THREE.Group(), st = std(0x9a958c, {flatShading:true});
  const part = (geo, y) => { const m = shadowed(new THREE.Mesh(geo, st)); m.position.y = y; g.add(m); return m; };
  part(new THREE.CylinderGeometry(0.2,0.24,0.08,6), 0.04);
  part(new THREE.CylinderGeometry(0.06,0.07,0.42,8), 0.29);
  part(new THREE.CylinderGeometry(0.17,0.12,0.06,6), 0.53);
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.17,0.2), std(0xffcf8a,{emissive:0xff9a3c, emissiveIntensity:1.6}));
  box.position.y = 0.645; g.add(box);
  for (const [x,z] of [[-0.095,-0.095],[0.095,-0.095],[-0.095,0.095],[0.095,0.095]]) part(new THREE.BoxGeometry(0.035,0.18,0.035),0.645).position.set(x,0.645,z);
  const roof = part(new THREE.ConeGeometry(0.27,0.17,6), 0.82); roof.rotation.y = Math.PI/6;
  part(new THREE.SphereGeometry(0.05,8,6), 0.93);
  lanternLight.position.y = 0.65; g.add(lanternLight);
  g.position.set(-1.35, 0, 0.75); scene.add(g); }

// cherry trees
const canopyMats = [0xf6b8c9,0xf09bb4,0xfbd0dc,0xe98aa8].map(c => std(c,{flatShading:true, roughness:0.8}));
const barkMat = std(0x4a3530, {flatShading:true});
function branch(group, from, dir, len, rad, depth){
  const to = from.clone().addScaledVector(dir, len);
  const geo = new THREE.CylinderGeometry(rad*0.7, rad, len, 6); geo.translate(0, len/2, 0);
  const m = shadowed(new THREE.Mesh(geo, barkMat));
  m.position.copy(from); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir); group.add(m);
  if (depth === 0) {
    for (let i=0;i<6;i++){ const c = shadowed(new THREE.Mesh(new THREE.IcosahedronGeometry(rand(0.22,0.38),0), canopyMats[i%4]));
      c.position.copy(to).add(new THREE.Vector3(rand(-0.3,0.3), rand(-0.1,0.25), rand(-0.3,0.3))); c.rotation.set(rand(0,3),rand(0,3),0); group.add(c); }
    return;
  }
  const n = depth === 2 ? 3 : 2;
  for (let i=0;i<n;i++){
    const d = dir.clone().add(new THREE.Vector3(rand(-0.9,0.9), rand(0.05,0.5), rand(-0.9,0.9))).normalize();
    branch(group, to, d, len*rand(0.6,0.75), rad*0.65, depth-1);
  }
}
function tree(x, z, s){ const g = new THREE.Group(); branch(g, new THREE.Vector3(), new THREE.Vector3(rand(-.15,.15),1,rand(-.15,.15)).normalize(), 0.9, 0.11, 2);
  g.position.set(x,0,z); g.scale.setScalar(s); g.rotation.y = rand(0,6); scene.add(g); return g; }
tree(-1.7, -1.3, 1.25); tree(1.6, -1.6, 1.05); tree(-0.2, -2.3, 0.9);

// grass tufts
{ const n = 900, geo = new THREE.ConeGeometry(0.018, 0.13, 3); geo.translate(0,0.065,0);
  const im = new THREE.InstancedMesh(geo, std(0xffffff), n), d = new THREE.Object3D(), col = new THREE.Color();
  let k = 0;
  while (k < n) { const a = rand(0,6.283), r = Math.sqrt(Math.random())*(ISL-0.1), x = Math.cos(a)*r, z = Math.sin(a)*r;
    if (Math.abs(x)<0.85 && Math.abs(z)<0.72) continue;
    if (Math.hypot(x-1.65, z-0.85) < 0.86) continue;
    d.position.set(x,0,z); d.rotation.set(rand(-.25,.25), rand(0,6), rand(-.25,.25)); d.scale.setScalar(rand(0.6,1.4)); d.updateMatrix();
    im.setMatrixAt(k, d.matrix); im.setColorAt(k, col.setHSL(rand(0.22,0.29), 0.45, rand(0.28,0.42))); k++; }
  im.receiveShadow = true; scene.add(im); }

// falling petals
const PN = 260, petalGeo = new THREE.PlaneGeometry(0.045, 0.03);
const petals = new THREE.InstancedMesh(petalGeo, std(0xffffff, {side:THREE.DoubleSide, roughness:0.7}), PN);
const pState = [], pd = new THREE.Object3D();
for (let i=0;i<PN;i++){
  pState.push({p:new THREE.Vector3(rand(-3,3), rand(0,3.5), rand(-3,3)), v:rand(0.12,0.25), w:rand(0.5,1.6), ph:rand(0,6.28), r:new THREE.Euler(rand(0,6),rand(0,6),rand(0,6))});
  petals.setColorAt(i, new THREE.Color().setHSL(rand(0.93,0.98), 0.75, rand(0.75,0.86)));
}
scene.add(petals);
function stepPetals(dt, t){
  for (let i=0;i<PN;i++){ const s = pState[i];
    s.p.y -= s.v*dt; s.p.x += Math.sin(t*s.w + s.ph)*0.12*dt + 0.05*dt; s.p.z += Math.cos(t*s.w*0.8 + s.ph)*0.1*dt;
    if (s.p.y < 0.01) { s.p.set(rand(-3,2.5), rand(2.6,3.6), rand(-3,3)); }
    s.r.x += dt*s.w; s.r.y += dt*0.7;
    pd.position.copy(s.p); pd.rotation.copy(s.r); pd.updateMatrix(); petals.setMatrixAt(i, pd.matrix); }
  petals.instanceMatrix.needsUpdate = true;
}
stepPetals(0, 0);

// ---------- doll ----------
const CLIPS = [
  {key:'Idle_Sway', label:'Idle sway'},
  {key:'Nod_Yes', label:'Nod yes'},
  {key:'Shake_No', label:'Shake no'},
  {key:'Happy_Bounce', label:'Happy bounce'},
];
const clipsEl = document.getElementById('clips');
const statusEl = document.getElementById('status'), progEl = document.getElementById('progress');
let mixer = null, actions = {}, current = null;

function select(key){
  const next = actions[key]; if (!next || next === current) return;
  next.reset().setEffectiveWeight(1).fadeIn(0.35).play();
  if (current) current.fadeOut(0.35);
  current = next;
  for (const b of clipsEl.children) b.setAttribute('aria-pressed', String(b.dataset.key === key));
}

async function fetchDoll(){
  const res = await fetch('doll.glb');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  // Pages may gzip the response, so content-length can be the compressed size; fall back to the known file size.
  const total = res.headers.get('content-encoding') ? 6873024 : (+res.headers.get('content-length') || 6873024);
  const reader = res.body.getReader(); const parts = []; let got = 0;
  for (;;) { const {done, value} = await reader.read(); if (done) break; parts.push(value); got += value.length;
    progEl.textContent = `loading doll · ${Math.min(99, Math.round(got / total * 100))}%`; }
  return await new Blob(parts).arrayBuffer();
}
const onDollError = err => {
  statusEl.firstChild.textContent = 'The doll could not be loaded.';
  progEl.textContent = 'The model file failed to load. Reload the page to try again.';
  console.error(err);
};
fetchDoll().then(buf => new THREE.GLTFLoader().parse(buf, '', gltf => {
  const doll = gltf.scene;
  doll.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  doll.position.y = 0.072;
  scene.add(doll);
  mixer = new THREE.AnimationMixer(doll);
  const byName = Object.fromEntries(gltf.animations.map(c => [c.name, c]));
  const list = CLIPS.filter(c => byName[c.key]).concat(gltf.animations.filter(c => !CLIPS.some(k => k.key === c.name)).map(c => ({key:c.name, label:c.name.replace(/_/g,' ')})));
  list.forEach((c, i) => {
    const clip = byName[c.key];
    const a = mixer.clipAction(clip); a.setLoop(THREE.LoopRepeat); actions[c.key] = a;
    const frames = Math.floor(clip.duration * 24 + 0.01);
    const b = document.createElement('button');
    b.className = 'clip'; b.dataset.key = c.key; b.setAttribute('aria-pressed','false'); b.id = 'clip-' + c.key;
    b.innerHTML = `<b>${c.label}</b><span>${i+1} · ${frames} frames · ${clip.duration.toFixed(1)} s</span>`;
    b.addEventListener('click', () => select(c.key));
    clipsEl.appendChild(b);
  });
  select(list[0] ? list[0].key : null);
  statusEl.hidden = true;
}, onDollError)).catch(onDollError);

// ---------- controls ----------
const pauseBtn = document.getElementById('pause'), orbitBtn = document.getElementById('orbit'), petalBtn = document.getElementById('petals');
let paused = false, showPetals = !reduce;
orbitBtn.setAttribute('aria-pressed', String(controls.autoRotate));
petalBtn.setAttribute('aria-pressed', String(showPetals)); petals.visible = showPetals;
pauseBtn.onclick = () => { paused = !paused; pauseBtn.textContent = paused ? 'Play' : 'Pause'; pauseBtn.setAttribute('aria-pressed', String(paused)); };
orbitBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; orbitBtn.setAttribute('aria-pressed', String(controls.autoRotate)); };
petalBtn.onclick = () => { showPetals = !showPetals; petals.visible = showPetals; petalBtn.setAttribute('aria-pressed', String(showPetals)); };
document.getElementById('reset').onclick = () => { camera.position.copy(HOME); controls.target.copy(TARGET); };
const rate = document.getElementById('rate'), rateOut = document.getElementById('rateOut');
rate.oninput = () => { rateOut.textContent = (+rate.value).toFixed(2) + '×'; };
addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= clipsEl.children.length) clipsEl.children[n-1].click(); if (e.key === ' ' && e.target === document.body) { e.preventDefault(); pauseBtn.click(); } });

// ---------- loop ----------
function resize(){ const w = canvas.clientWidth, h = canvas.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock(); let t = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt;
  if (mixer && !paused) mixer.update(dt * (+rate.value));
  if (showPetals) stepPetals(dt, t);
  lanternLight.intensity = 1.15 + Math.sin(t*7.3)*0.06 + Math.sin(t*13.1)*0.04;
  controls.update();
  renderer.render(scene, camera);
});
})();
</script>
